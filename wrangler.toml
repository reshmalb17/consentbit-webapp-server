name = "consent-webapp-manager"
main = "src/index.js"
compatibility_date = "2026-02-02"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"

[[d1_databases]]
binding = "CONSENT_WEBAPP"
database_name = "consent-webapp"
database_id = "bc37fa30-5060-491d-b19c-f3eeb7b1fd00"

[[d1_databases]]
binding = "LEGACY_DB"
database_name = "consentbit-licenses"
database_id = "3a0cf7e2-34a9-4d06-a5b7-c1238d13290e"

[[d1_databases]]
binding = "BANNER_CONFIG_DB"
database_name = "banner-config-db"
database_id = "8b467c8c-2ff8-43b5-9338-a4e9191e6014"

# Cookie-scanner DB (same D1 the cookie-scanner worker writes to). Bound here so the
# auth worker can read a handed-off scan report directly and render its PDF locally.
[[d1_databases]]
binding = "COOKIE_SCANNER_DB"
database_name = "cookie-scanner-db"
database_id = "b66e816a-d6df-463f-97aa-45ee475f6bbc"

[[kv_namespaces]]
binding = "WEBFLOW_AUTHENTICATION"
id = "aa64050ef7804e7783fe9680daae80c5"

[[r2_buckets]]
binding = "R2"
bucket_name = "cookies-data"

[[kv_namespaces]]
binding = "AUTH_STORE_FRAMER"
id = "6bf69f88af4e4f7ebe19f811e8b232b9"

[[kv_namespaces]]
binding = "BANNER_KV_FRAMER"
id = "d63b31eee44245b2a039b8f9566a6f44"

[[kv_namespaces]]
binding = "CONSENT_STORE_FRAMER"
id = "0ad4a627265c43279493720bf7532f77"

[[kv_namespaces]]
binding = "ACTIVE_SITES_CONSENTBIT"
id = "66c7aa5c7fcb4c2a8dfec5463e86a293"

[[kv_namespaces]]
binding = "ACTIVE_SITES_CONSENTBIT_FRAMER"
id = "f89c8bbb2dd843b8aebf30a745723a2c"

[[kv_namespaces]]
binding = "UN_ASSIGNED_LICENSE_KEYS"
id = "75ceeaf610d54418aa82480cad36e125"

[[kv_namespaces]]
binding = "CHECKOUT_TOKENS"
id = "353f494f977440feb2120b3464aa917a"

[vars]
# ClickUp Integration — set real values as secrets:
#   wrangler secret put CLICKUP_API_KEY
#   wrangler secret put CLICKUP_LIST_WEBFLOW
#   wrangler secret put CLICKUP_LIST_FRAMER
#   wrangler secret put CLICKUP_LIST_WEBSITE
# Get your Personal API Token from: ClickUp → Profile Avatar → Settings → Apps → API Token
# Get list IDs from: open a list in ClickUp → the URL contains /l/<LIST_ID>
CLICKUP_LIST_WEBFLOW = "901607427707"
CLICKUP_LIST_FRAMER = "901611572886"
CLICKUP_LIST_WEBSITE = "901615238761"
CLICKUP_FIELD_PAYMENT_EMAIL = "991d3068-5abc-41b5-b010-12c03f2d77a3"
CLICKUP_FIELD_CUSTOMER_NAME = "c07fa9be-894a-4f09-a806-b5faf8857d88"
CLICKUP_FIELD_DATE_CREATED = "acea131c-fa37-41ca-9716-c59ad62a5059"
CLICKUP_FIELD_STAGING_EMAIL = "ec4069b3-96a9-4a7c-91a4-96600f69c9fc"

POSTHOG_API_KEY = "phc_pACPAPjdZRJRopr5EkE4AEHMwS9qqYdQC4pvEVMYdLzJ"
JWT_SECRET="x7K9pL2mQ5vR8tY1nB4jH7uF0zA3eD6cK9pL2mQ5vR8tY1nB4jH7uF0zA3eD6cK9p"
# Shared secret for calling cb-server internal APIs. Must match cb-server's LEGACY_API_SECRET.
LEGACY_API_SECRET = "cb-internal-legacy-2025"
# Admin key for /api/admin/* routes — send as `X-Admin-Key` header.
ADMIN_SECRET = "cb-admin-7Kp2vQ8mNx9LtR5yJ4hB6fW1aZ3sE0d"
# Base URL of the cb-server (app.consentbit.com) for internal calls.
CB_SERVER_BASE_URL = "https://app.consentbit.com"

# Public Worker URL for stored embed `<script src>` (no trailing slash). Prefer setting **CDN_BASE_URL**
# in Cloudflare → Workers → your worker → Settings → Variables (so production isn’t tied to this file).
# If unset here and not in the dashboard, the Worker uses `request.url.origin` (OK when the API is called on the worker hostname).
CDN_BASE_URL = ""
# Public origin of your Next.js app (no trailing slash). If set, embed tries https://<WEBAPP>/asset/logo.webp first; on failure it loads /embed/floating-logo.svg from this Worker. If empty, the Worker SVG is used directly.
WEBAPP_PUBLIC_URL = ""
# --- Tier plans (Basic / Essential / Growth) — one Stripe *subscription* per checkout, one recurring price per line item ---
# In Stripe Dashboard: create **3 products** (one per tier). Each product has **2 recurring prices** (month + year).
# Map those six price_ ids here. Checkout uses exactly one price → one subscription for the chosen plan + billing interval.
# Tier Basic/Essential/Growth: must be **Recurring** Stripe prices (subscription), not one-time — or Checkout returns "recurring price" errors.
# If only Basic fails: open the Basic product in Stripe → each price must say "Recurring" / subscription. One-time prices will not work.
STRIPE_PRICE_BASIC_MONTHLY = "price_1T7doaJwcuG9163M3fNkG77K" 
STRIPE_PRICE_BASIC_YEARLY = "price_1T7dqFJwcuG9163MlGnV7DRn"
STRIPE_PRICE_ESSENTIAL_MONTHLY = "price_1T7drWJwcuG9163MSZepvR2S"
STRIPE_PRICE_ESSENTIAL_YEARLY = "price_1T7drnJwcuG9163MQ03txwwC"
STRIPE_PRICE_GROWTH_MONTHLY = "price_1T7dsaJwcuG9163MIcICCuWk"
STRIPE_PRICE_GROWTH_YEARLY = "price_1T7dt2JwcuG9163M9xaqMCk6"


# Single plan: recurring subscription prices (promo applies to initial; renewals use these)
STRIPE_PRICE_MONTHLY = "price_1RMxWNJwcuG9163MoH33aEjh"
STRIPE_PRODUCT_MONTHLY = "prod_SHWZdF20XLXtn9"
STRIPE_PRICE_YEARLY = "price_1Sz1ehJwcuG9163Mt7yNlrD6"
STRIPE_PRODUCT_YEARLY = "prod_TwvVRX1MaDL7wV"


# Bulk purchase (not used — create-checkout-session rejects bulk/quantity; per-site tier / legacy single only).
# STRIPE_ONE_TIME_PRICE_MONTHLY = "price_1SpSusJwcuG9163MHGK38FfW"
# STRIPE_ONE_TIME_PRICE_YEARLY = "price_1SpSw0JwcuG9163MLkRgIPmD"
# STRIPE_ONE_TIME_PRODUCT_MONTHLY = "prod_Tn30iMTLmnS6Yz"
# STRIPE_ONE_TIME_PRODUCT_YEARLY = "prod_Tn329EHlZLyLtR"

# Cloudflare Browser Rendering — headless Chrome for full cookie scanning
[browser]
binding = "BROWSER"

# Cron trigger to execute scheduled scans every minute
[triggers]
crons = ["*/1 * * * *"]


